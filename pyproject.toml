[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-kernel"
version = "0.1.0"
description = "Single-GPU Triton MoE kernels for Qwen3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
vllm = ["vllm==0.20.0"]

[project.entry-points."vllm.general_plugins"]
moe_kernel = "integrations.vllm.adapter:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["moe_kernel*", "integrations*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
