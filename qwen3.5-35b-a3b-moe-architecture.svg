<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 804" width="1120" height="804" role="img" aria-labelledby="title description">
  <title id="title">Qwen3.5-35B-A3B text decoder and MoE block</title>
  <desc id="description">The text decoder repeats a group of three Gated DeltaNet layers and one Gated Attention layer ten times, with sparse MoE in each layer. Each token is routed to eight of 256 SwiGLU experts. Their weighted sum is added to the gated output of one shared expert.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0l9 4.5L0 9z" fill="#526983"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #172a44; }
    .heading { font-size: 36px; font-weight: 700; fill: #fff; }
    .subtitle { font-size: 17px; fill: #c6d8f3; }
    .section { font-size: 21px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 700; }
    .note { font-size: 15px; fill: #3e5670; }
    .small { font-size: 13.5px; fill: #3e5670; }
    .center { text-anchor: middle; }
    .wire { fill: none; stroke: #526983; stroke-width: 1.8; marker-end: url(#arrow); }
    .panel { fill: #fff; stroke: #c7d5e5; }
    .delta { fill: #edf4ff; stroke: #adc3ec; }
    .attention { fill: #f3eeff; stroke: #c8b4ea; }
    .routed { fill: #f0f6ff; stroke: #b6ccef; }
    .shared { fill: #edf8f6; stroke: #b2d8cf; }
    .box { fill: #fff; stroke: #b6c8de; }
  </style>
  <rect x="0.5" y="0.5" width="1119" height="803" rx="22" fill="#f3f7fc" stroke="#c7d5e5"/>
  <path d="M22 1h1076a21 21 0 0 1 21 21v80H1V22A21 21 0 0 1 22 1z" fill="#122c50"/>
  <text x="42" y="51" class="heading">Qwen3.5-35B-A3B</text>
  <text x="43" y="78" class="subtitle">Hybrid text decoder and sparse mixture of experts</text>

  <rect x="28" y="123" width="1064" height="164" rx="16" class="panel"/>
  <text x="52" y="158" class="section">Text decoder</text>
  <text x="1068" y="158" text-anchor="end" class="note">4-layer group × 10 · 40 decoder layers</text>
  <g class="center">
    <rect x="53" y="178" width="232" height="77" rx="10" class="delta"/>
    <text x="169" y="210" class="label">Gated DeltaNet</text>
    <text x="169" y="235" class="note">Sparse MoE</text>
    <rect x="315" y="178" width="232" height="77" rx="10" class="delta"/>
    <text x="431" y="210" class="label">Gated DeltaNet</text>
    <text x="431" y="235" class="note">Sparse MoE</text>
    <rect x="577" y="178" width="232" height="77" rx="10" class="delta"/>
    <text x="693" y="210" class="label">Gated DeltaNet</text>
    <text x="693" y="235" class="note">Sparse MoE</text>
    <rect x="839" y="178" width="228" height="77" rx="10" class="attention"/>
    <text x="953" y="210" class="label">Gated Attention</text>
    <text x="953" y="235" class="note">Sparse MoE</text>
  </g>
  <path d="M285 216h27" class="wire"/>
  <path d="M547 216h27" class="wire"/>
  <path d="M809 216h27" class="wire"/>

  <rect x="28" y="306" width="1064" height="470" rx="16" class="panel"/>
  <text x="52" y="343" class="section">Sparse MoE in each layer</text>
  <rect x="425" y="365" width="270" height="40" rx="8" class="box"/>
  <text x="560" y="390" class="center label">Hidden states x · H = 2048</text>

  <rect x="53" y="438" width="492" height="233" rx="12" class="routed"/>
  <rect x="575" y="438" width="492" height="233" rx="12" class="shared"/>
  <path d="M560 405v13H299v18" class="wire"/>
  <path d="M560 418h261v18" class="wire"/>
  <text x="79" y="471" class="label">Routed experts</text>
  <text x="521" y="471" text-anchor="end" class="small">8 of 256 per token</text>
  <text x="601" y="471" class="label">Shared expert</text>
  <text x="1043" y="471" text-anchor="end" class="small">1 for every token</text>

  <g class="center">
    <rect x="79" y="489" width="440" height="40" rx="8" class="box"/>
    <text x="299" y="514" class="label">Router Linear → Softmax Top-8 + renormalization</text>
    <rect x="79" y="546" width="440" height="40" rx="8" class="box"/>
    <text x="299" y="571" class="label">Selected SwiGLU experts on x · I = 512</text>
    <rect x="79" y="603" width="440" height="40" rx="8" class="box"/>
    <text x="299" y="628" class="label">Route-weighted sum over 8 expert outputs</text>

    <rect x="601" y="489" width="440" height="40" rx="8" class="box"/>
    <text x="821" y="514" class="label">Shared SwiGLU expert on x · I = 512</text>
    <rect x="601" y="546" width="440" height="40" rx="8" class="box"/>
    <text x="821" y="571" class="label">Scale output by sigmoid(Linear(x))</text>
  </g>
  <path d="M299 529v14" class="wire"/>
  <path d="M299 586v14" class="wire"/>
  <path d="M821 529v14" class="wire"/>
  <path d="M299 643v56h239" class="wire"/>
  <path d="M821 586v113H582" class="wire"/>
  <circle cx="560" cy="699" r="18" fill="#e6eefb" stroke="#a7bedc"/>
  <path d="M553 699h14m-7-7v14" stroke="#1a416d" stroke-width="2"/>
  <path d="M560 717v13" class="wire"/>
  <text x="560" y="751" class="center label">MoE output</text>
</svg>
